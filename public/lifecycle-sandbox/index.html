<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempo | L&D Lifecycle Sandbox</title><style>
:root{font:14px system-ui,Arial;color:#233044;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#162743;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1150px;margin:24px auto;padding:0 16px}h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:0 0 16px}.muted{color:#64748b}.panel{background:white;border:1px solid #e0e5ed;border-radius:12px;padding:20px;margin:16px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select,input{font:inherit;border:1px solid #c9d3e0;border-radius:7px;padding:9px 12px;background:white;color:#24334d}button{cursor:pointer}button.primary{background:#2f61b5;border-color:#2f61b5;color:white}button:disabled{opacity:.45;cursor:not-allowed}.active{background:#ddeafe}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#e9edf4;font-size:12px}.ok{background:#ddefe2;color:#236a37}.warn{background:#fff0d3;color:#926017}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.right{margin-left:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e5e9ef}th{font-size:12px;color:#64748b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{background:#f8fafc;padding:14px;border:1px solid #e4e9ef;border-radius:9px}.kpi{font-size:24px;font-weight:bold}.hidden{display:none}.notice{border-left:4px solid #dca541;padding:12px;background:#fff9e8}.flow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.flow span{padding:12px;border-radius:8px;background:#eaf0f9}.flow b{color:#64748b}input{max-width:260px}label{font-weight:600}small{color:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:12px}th,td{padding:8px 4px}} </style></head><body>
<header><strong>Tempo · L&D Lifecycle</strong><span class="pill warn">SANDBOX · NO LIVE DATA</span></header><main><h1>L&D Project Lifecycle Sandbox</h1><p class="muted">Interactive testing only. Changes stay in this browser; nothing is sent to Supabase.</p><div class="notice">Preview-only prototype. Not connected to live projects, employee records, time logs or notifications.</div><nav id="tabs"></nav><div id="app"></div></main>
<script>
const KEY='tempo_lnd_sandbox_v2';
function initial(){return {name:'Self-Led Learning Module',status:'Draft',scope:false,started:null,persona:'Fritzie',tasks:[
{id:1,name:'Discovery call',phase:0,owner:'Joseph',role:'Standard',status:'Ready',depends:0,hours:0},
{id:2,name:'Define learning scope',phase:0,owner:'Fritzie',role:'Standard',status:'Waiting',depends:1,hours:0},
{id:3,name:'Design learning experience',phase:1,owner:'Fritzie',role:'Development',status:'Waiting',depends:0,hours:0},
{id:4,name:'QA learning design',phase:1,owner:'Joseph',role:'QA',status:'Waiting',depends:3,hours:0},
{id:5,name:'Approve learning design',phase:1,owner:'Sandra',role:'Approval',status:'Waiting',depends:4,hours:0}
],history:[],next:6}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}let tab='Overview';
const el=document.getElementById('app');
const people=['Fritzie','Joseph','Sandra','Ren'];
const phases=['Analysis & Scoping','Learning Design','Learning Development','Implementation / Delivery','Evaluation & Closure'];
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function log(s){db.history.unshift(new Date().toLocaleString()+' — '+s)}
function get(id){return db.tasks.find(t=>t.id===+id)}
function done(t){return ['Completed','QA Passed','Approved'].includes(t.status)}
function eligible(t){if(t.phase>0&&db.status!=='Active')return false;if(t.status==='Waiting'&&(!t.depends||done(get(t.depends)))&&(t.phase===0||db.status==='Active'))t.status='Ready';return ['Ready','In Progress','Revision Required'].includes(t.status)}
function progress(){db.tasks.forEach(eligible)}
function chip(s){let cls=done({status:s})?'ok':s==='Revision Required'?'warn':'';return '<span class="pill '+cls+'">'+s+'</span>'}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function taskRow(t,actions=false){return '<tr><td>T'+t.id+'</td><td>'+esc(t.name)+'</td><td>'+phases[t.phase]+'</td><td>'+esc(t.owner)+'</td><td>'+esc(t.role)+'</td><td>'+chip(t.status)+'</td><td>'+(t.depends?'T'+t.depends:'—')+'</td>'+(actions?'<td>'+buttons(t)+'</td>':'')+'</tr>'}
function buttons(t){if(!eligible(t)||done(t))return '—';let b=[];function add(label,cmd){b.push('<button onclick="'+cmd+'">'+label+'</button>')}if(t.role==='Standard')add('Complete','act('+t.id+',"complete")');if(t.role==='Development'){add(t.status==='Revision Required'?'Resubmit':'Ready for QA','act('+t.id+',"submit")')}if(t.role==='QA'){add('Pass QA','act('+t.id+',"pass")');add('Request revision','act('+t.id+',"revise")')}if(t.role==='Approval'){add('Approve / Sign off','act('+t.id+',"approve")');add('Request revision','act('+t.id+',"revise")')}return b.join(' ')}
function act(id,action){let t=get(id);if(!t||t.owner!==db.persona||!eligible(t))return;let next=db.tasks.find(z=>z.depends===t.id);if(action==='complete'){t.status='Completed';log(t.name+' completed')}if(action==='submit'){t.status='Awaiting Review';let dest=db.tasks.find(z=>z.id===t.returnTo)||next;if(dest){dest.status='Ready';log(t.name+' submitted to '+dest.owner)}else{t.status='Completed';log(t.name+' completed')}}if(action==='pass'){t.status='QA Passed';if(next)next.status='Ready';log(t.name+' passed QA')}if(action==='approve'){t.status='Approved';let dev=db.tasks.find(z=>z.role==='Development'&&z.phase===t.phase);if(dev)dev.status='Completed';log(t.name+' signed off')}if(action==='revise'){let dev=db.tasks.find(z=>z.role==='Development'&&z.phase===t.phase);let msg=prompt('What needs revision?');if(!dev||!msg?.trim())return;dev.status='Revision Required';dev.returnTo=t.id;t.status='Waiting for Revision';log(t.owner+' requested revision on '+dev.name+': '+msg.trim())}save()}
function addTask(){let name=document.getElementById('newname').value.trim(),phase=+document.getElementById('newphase').value,owner=document.getElementById('newowner').value,role=document.getElementById('newrole').value,depends=+document.getElementById('newdep').value;if(!name){alert('Enter a task title');return}let t={id:db.next++,name,phase,owner,role,status:'Waiting',depends,hours:0};db.tasks.push(t);log('Added '+name);save()}
function completeScope(){if(db.tasks.filter(t=>t.phase===0).some(t=>!done(t))){alert('Finish all scoping tasks first.');return}db.scope=true;log('Scope Confirmed milestone achieved');save()}
function startProject(){if(!db.scope){alert('Confirm scope first');return}db.status='Active';db.started=new Date().toISOString();log('Project officially started');save()}
function logHours(id){let t=get(id);if(!t||t.owner!==db.persona||!eligible(t))return;let raw=prompt('Hours to log (test data only):','1');if(raw===null)return;let val=Number(raw);if(!Number.isFinite(val)||val<=0||val>24){alert('Enter hours greater than 0, up to 24');return}t.hours+=val;log(db.persona+' logged '+val+' simulated hours on '+t.name);save()}
function view(){progress();document.getElementById('tabs').innerHTML=['Overview','WBS Planning','My To Do','Time & Effort','History'].map(x=>'<button class="'+(x===tab?'active':'')+'" onclick="tab=\''+x+'\';render()">'+x+'</button>').join('');let html='';
if(tab==='Overview'){html='<div class="panel"><h2>Project · '+esc(db.name)+'</h2><div class="grid"><div class="tile"><small>Project status</small><p>'+chip(db.status)+'</p></div><div class="tile"><small>Scoping milestone</small><p>'+chip(db.scope?'Confirmed':'Pending')+'</p></div><div class="tile"><small>Simulated effort</small><div class="kpi">'+db.tasks.reduce((s,t)=>s+t.hours,0).toFixed(1)+' h</div></div></div><h2>Lifecycle</h2><div class="flow">'+phases.map(x=>'<span>'+x+'</span>').join('<b>→</b>')+'</div><div class="row">'+(db.scope?'': '<button class="primary" onclick="completeScope()">Confirm Scope Milestone</button>')+(db.scope&&db.status==='Draft'?'<button class="primary" onclick="startProject()">Start Project</button>':'')+'</div><small>Scoping can be worked while Draft. Learning Design becomes actionable only after official Start Project.</small></div>'}
if(tab==='WBS Planning'){html='<div class="panel"><h2>Project WBS · Phase-based</h2><div style="overflow-x:auto"><table><tr><th>ID</th><th>Task</th><th>Phase</th><th>Owner</th><th>Role</th><th>Status</th><th>Depends</th></tr>'+db.tasks.map(t=>taskRow(t)).join('')+'</table></div></div><div class="panel"><h2>Add test task</h2><div class="row"><input id="newname" placeholder="Task name"><select id="newphase">'+phases.map((v,i)=>'<option value="'+i+'">'+v+'</option>').join('')+'</select><select id="newowner">'+people.map(p=>'<option>'+p+'</option>').join('')+'</select><select id="newrole">'+['Standard','Development','QA','Approval'].map(p=>'<option>'+p+'</option>').join('')+'</select><select id="newdep"><option value="0">No dependency</option>'+db.tasks.map(t=>'<option value="'+t.id+'">T'+t.id+' · '+esc(t.name)+'</option>').join('')+'</select><button class="primary" onclick="addTask()">Add task</button></div></div>'}
if(tab==='My To Do'){html='<div class="panel"><div class="row"><h2>Ready for my action</h2><label class="right">View as <select onchange="db.persona=this.value;save()">'+people.map(p=>'<option '+(db.persona===p?'selected':'')+'>'+p+'</option>').join('')+'</select></label></div><div style="overflow-x:auto"><table><tr><th>ID</th><th>Task</th><th>Phase</th><th>Owner</th><th>Role</th><th>Status</th><th>Depends</th><th>Actions</th></tr>'+db.tasks.filter(t=>t.owner===db.persona&&eligible(t)).map(t=>taskRow(t,true)).join('')+'</table></div><p class="muted">Only actionable tasks are shown. Waiting reviews stay out of My To Do.</p></div>'}
if(tab==='Time & Effort'){html='<div class="panel"><div class="row"><h2>Simulated time logs</h2><label class="right">View as <select onchange="db.persona=this.value;save()">'+people.map(p=>'<option '+(db.persona===p?'selected':'')+'>'+p+'</option>').join('')+'</select></label></div>'+db.tasks.filter(t=>t.owner===db.persona).map(t=>'<div class="row"><span>'+esc(t.name)+' · '+t.hours.toFixed(1)+' h</span><button class="right" '+(!eligible(t)?'disabled':'')+' onclick="logHours('+t.id+')">Log test hours</button></div>').join('')+'</div>'}
if(tab==='History'){html='<div class="panel"><h2>Activity history (browser only)</h2>'+db.history.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>'}
el.innerHTML=html+'<div class="row"><button onclick="if(confirm(\'Reset all sandbox test data?\')){db=initial();save()}">Reset sandbox</button><small>No real data is created, updated or deleted.</small></div>'}
function render(){view()}render();
</script></body></html>
